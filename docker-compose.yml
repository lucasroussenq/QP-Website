services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud_viacoes_app
    ports:

  "8080:80"
volumes:
  ./src:/var/www/html
environment:
  TZ=America/Sao_Paulo
depends_on:
  db

db:
  image: mysql:8.0
  container_name: crud_viacoes_db
  restart: unless-stopped
  command: --default-time-zone='-03:00'
  environment:
    MYSQL_DATABASE: viacoes
    MYSQL_USER: app
    MYSQL_PASSWORD: app123
    MYSQL_ROOT_PASSWORD: root123
  ports:

  "3307:3306"
volumes:
  mysql_data:/var/lib/mysql

volumes:
  mysql_data: